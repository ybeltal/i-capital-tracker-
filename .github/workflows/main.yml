name: Daily Morning CRM Briefing

on:
  schedule:
    # 05:00 UTC = 08:00 AM Nairobi / Addis Ababa time (UTC+3) every day
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual testing anytime

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Morning Briefing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BRIEF_RECIPIENT_EMAIL: ${{ secrets.BRIEF_RECIPIENT_EMAIL || 'ybeltalsemagn8899@gmail.com' }}
        run: node scripts/sendDailyBrief.js
